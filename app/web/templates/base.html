<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Agent Eval{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  {% if principal %}
  <header class="top">
    <a class="brand" href="/">AI Agent Eval</a>
    <nav>
      <a href="/settings">Settings</a>
    </nav>
    <span class="who">{{ principal.role }}</span>
    <button class="link" data-api="/api/v1/auth/logout" data-method="POST" data-redirect="/login">Sign out</button>
  </header>
  {% endif %}
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
