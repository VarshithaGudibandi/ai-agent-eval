name: agent-eval

x-app: &app
  build: .
  image: agent-eval:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_eval}:${POSTGRES_PASSWORD:-agent_eval}@postgres:5432/${POSTGRES_DB:-agent_eval}
    APP_MASTER_KEY: ${APP_MASTER_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_eval}
      POSTGRES_DB: ${POSTGRES_DB:-agent_eval}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.execution.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Time to finish in-flight jobs on stop. Anything still running after this is killed,
    # its lease expires and another worker retries it.
    stop_grace_period: 90s

volumes:
  postgres-data:
