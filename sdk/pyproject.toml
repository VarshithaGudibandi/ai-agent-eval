[project]
name = "agent-eval-sdk"
version = "0.1.0"
description = "Send an agent's traces to the agent eval platform, from a test run or from production."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_eval"]
