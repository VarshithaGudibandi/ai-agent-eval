[project]
name = "agent-eval-mcp"
version = "0.1.0"
description = "An MCP server for asking the AI Agent Eval platform about your agents."
requires-python = ">=3.12"
dependencies = ["agent-eval-sdk", "mcp>=2.3,<3"]

[project.scripts]
agent-eval-mcp = "agent_eval_mcp.server:main"

[tool.uv.sources]
agent-eval-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_eval_mcp"]
